[package]
name = "komorebi-tray-grid"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "System tray indicator for the komorebi tiling window manager"
license = "MIT OR Apache-2.0"
repository = "https://github.com/your-org/komorebi-tray-grid"
publish = false

[lib]
name = "komorebi_tray_grid"
path = "src/lib.rs"

[[bin]]
name = "komorebi-tray-grid"
path = "src/main.rs"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[target.'cfg(windows)'.dependencies]
tao = "0.35"
tray-icon = "0.24"
tokio = { version = "1", features = ["rt", "macros", "net", "io-util", "process", "time", "sync"] }
winreg = "0.56"
once_cell = "1"

[target.'cfg(windows)'.dependencies.windows]
version = "0.62"
features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_Security",
]

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }

[build-dependencies]
embed-resource = "3"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
