[package]
name = "komorebi-tray-grid"
version = "0.2.2"
edition = "2021"
rust-version = "1.85"
description = "System tray indicator for the komorebi tiling window manager"
license = "MIT OR Apache-2.0"
repository = "https://github.com/your-org/komorebi-tray-grid"
publish = false

[lib]
name = "komorebi_tray_grid"
path = "src/lib.rs"

[[bin]]
name = "komorebi-tray-grid"
path = "src/main.rs"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[target.'cfg(windows)'.dependencies]
tao = "0.35"
tray-icon = "0.24"
winreg = "0.56"
once_cell = "1"
# AF_UNIX sockets on Windows. komorebi-client already pulls this in
# transitively (via the upstream `komorebi` crate); we depend on it directly
# so the worker can do a bare connect-only liveness probe to komorebi's main
# socket without going through `komorebi_client::send_message` (which would
# always write a message and hence trigger a broadcast to all subscribers).
# Version pinned to match the transitive resolution.
uds_windows = "1.2.1"

# komorebi IPC client (replaces shelling out to `komorebic.exe`). The crate
# is not published on crates.io and transitively pulls in the full komorebi
# library; `default-features = false` only drops the optional `schemars`
# feature, which we don't need. Pinned to the latest upstream tag.
komorebi-client = { git = "https://github.com/LGUG2Z/komorebi.git", tag = "v0.1.41", default-features = false }

[target.'cfg(windows)'.dependencies.windows]
version = "0.62"
features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_Security",
    "Win32_UI_WindowsAndMessaging",
]

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }
# Used by `examples/gen_icon.rs` to write a multi-resolution `assets/app.ico`
# from the in-process renderer. Not a runtime dependency.
ico = "0.5"

[build-dependencies]
embed-resource = "3"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"

# ---------------------------------------------------------------------------
# Windows installer / portable package, built via `cargo packager --release`.
#
#   cargo install cargo-packager --locked
#   cargo packager --release
#
# Produces an NSIS installer (`*.exe`) under `target/release/` (NSIS lets the
# end user pick per-user vs. per-machine install at runtime). The CLI honors
# `beforePackagingCommand` to compile a release binary first, so a bare
# `cargo packager --release` is enough — see `release.yml` for the CI flow.
# ---------------------------------------------------------------------------
[package.metadata.packager]
productName = "Komorebi Tray Grid"
identifier = "dev.h0tk3y.komorebi-tray-grid"
description = "System tray indicator for the komorebi tiling window manager."
longDescription = """
Komorebi Tray Grid is a tiny Windows tray app that visualizes the state of \
the komorebi tiling window manager as a 3×3 grid icon (one per monitor), \
with a right-click menu to toggle Windows logon autostart.
"""
publisher = "h0tk3y"
homepage = "https://github.com/h0tk3y/komorebi-tray-grid"
copyright = "Copyright © h0tk3y"
category = "Utility"
formats = ["nsis"]
icons = ["assets/app.ico"]
# Compile the binary that NSIS will then wrap. The packager picks up the
# resulting exe from `binariesDir` (`target/release/`) via the `binaries`
# entry below; the produced installer lands in `outDir` (`target/packager/`).
beforePackagingCommand = "cargo build --release --locked"
out-dir = "target/packager"
binariesDir = "target/release"

[[package.metadata.packager.binaries]]
path = "komorebi-tray-grid"
main = true

[package.metadata.packager.nsis]
# Per-user install only. The app talks to komorebi via a named pipe and
# komorebi runs at the user's medium integrity level; if we let NSIS run
# elevated (per-machine install) and auto-launch the app afterwards, the
# app inherits a High-IL token and komorebi can no longer write events
# into our pipe (only the initial `komorebic state` snapshot works). A
# per-user install (`%LOCALAPPDATA%\Programs\…`) avoids elevation entirely
# and matches the existing HKCU autostart model.
installMode = "currentUser"
