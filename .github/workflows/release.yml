name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (windows-msvc)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain (pinned)
        # `rust-toolchain.toml` pins the actual version; this step just makes
        # sure rustup is available and the right target component is installed.
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.90.0"
          targets: x86_64-pc-windows-msvc

      - name: Cache cargo registry and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build (release)
        run: cargo build --release --locked --target x86_64-pc-windows-msvc

      - name: Run tests
        run: cargo test --release --locked --target x86_64-pc-windows-msvc

      - name: Stage artifact
        shell: pwsh
        run: |
          $stage = "dist/komorebi-tray-grid"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item "target/x86_64-pc-windows-msvc/release/komorebi-tray-grid.exe" "$stage/"
          Copy-Item "README.md" "$stage/" -ErrorAction SilentlyContinue
          Copy-Item "spec.md"   "$stage/" -ErrorAction SilentlyContinue
          Compress-Archive -Path "$stage/*" -DestinationPath "dist/komorebi-tray-grid-windows-x86_64.zip" -Force

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: komorebi-tray-grid-windows-x86_64
          path: dist/komorebi-tray-grid-windows-x86_64.zip
          if-no-files-found: error

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/komorebi-tray-grid-windows-x86_64.zip
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
          generate_release_notes: true
